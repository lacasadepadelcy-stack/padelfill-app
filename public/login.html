<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Σύνδεση · PadelFill</title>
<style>
  :root{
    --surface-0:#f7f6f2; --surface-2:#ffffff;
    --text-primary:#2c2c2a; --text-secondary:#5f5e5a;
    --border:#d3d1c7; --border-strong:#b4b2a9;
    --accent:#0c447c; --accent-hover:#0a3763;
    --text-danger:#7a2323; --radius:10px;
  }
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--surface-0); color:var(--text-primary);
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .box{
    background:var(--surface-2); border:0.5px solid var(--border);
    border-radius:14px; padding:2rem; width:100%; max-width:340px;
    box-shadow:0 4px 18px rgba(0,0,0,0.06);
  }
  h1{ font-size:19px; font-weight:600; margin:0 0 4px; }
  p.sub{ font-size:13px; color:var(--text-secondary); margin:0 0 1.5rem; }
  label{ font-size:12px; color:var(--text-secondary); display:block; margin:0 0 4px; }
  input{
    width:100%; box-sizing:border-box; font-size:14px; padding:10px 12px;
    border-radius:var(--radius); border:0.5px solid var(--border-strong);
    margin-bottom:14px; background:var(--surface-0);
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{
    width:100%; font-size:14px; font-weight:600; padding:11px 12px;
    border-radius:var(--radius); border:none; background:var(--accent);
    color:#fff; cursor:pointer; transition:background 0.15s ease;
  }
  button:hover{ background:var(--accent-hover); }
  button:disabled{ opacity:0.6; cursor:default; }
  .error{ color:var(--text-danger); font-size:13px; margin:0 0 12px; display:none; }
</style>
</head>
<body>
  <div class="box">
    <h1>PadelFill</h1>
    <p class="sub">La Casa de Padel CY · Σύνδεση διαχειριστή</p>
    <p class="error" id="err"></p>
    <form id="loginForm">
      <label for="username">Όνομα χρήστη</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Κωδικός</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Σύνδεση</button>
    </form>
  </div>

<script>
  const form = document.getElementById("loginForm");
  const err = document.getElementById("err");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "...";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        window.location.href = "/";
      } else {
        err.textContent = data.error || "Κάτι πήγε στραβά.";
        err.style.display = "block";
      }
    } catch (e2) {
      err.textContent = "Πρόβλημα σύνδεσης με τον server.";
      err.style.display = "block";
    }
    submitBtn.disabled = false;
    submitBtn.textContent = "Σύνδεση";
  });
</script>
</body>
</html>
