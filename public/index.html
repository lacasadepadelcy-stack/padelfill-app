<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>PadelFill</title>
<style>
  :root{
    --surface-0:#f6f5f1; --surface-1:#eeece4; --surface-2:#ffffff;
    --text-primary:#232320; --text-secondary:#615f59; --text-muted:#8b8a82;
    --border:#dedbd0; --border-strong:#c3c0b3;
    --bg-accent:#e5f0fb; --text-accent:#0c447c;
    --bg-pro:#ede9fe; --text-pro:#4338a8;
    --bg-warning:#fdefda; --text-warning:#7a4a05; --border-warning:#eda440;
    --text-success:#1f6b2b; --bg-success:#e7f5e6;
    --text-danger:#a53434; --bg-danger:#fbe9e9;
    --accent:#0c447c; --accent-hover:#0a3763;
    --radius:10px; --radius-lg:14px;
    --shadow-sm:0 1px 2px rgba(20,20,15,0.05), 0 1px 1px rgba(20,20,15,0.04);
    --shadow-md:0 4px 14px rgba(20,20,15,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--surface-0); color:var(--text-primary); margin:0;
    padding:0 1.25rem 3rem; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:840px; margin:0 auto; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:1.5rem 0 1.1rem; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background:var(--accent);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  h1{ font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .sub{ font-size:12.5px; color:var(--text-secondary); margin:2px 0 0; }
  input, button{ font-size:13px; padding:7px 12px; border-radius:var(--radius); border:0.5px solid var(--border-strong); background:var(--surface-2); font-family:inherit; color:var(--text-primary); }
  button{ cursor:pointer; transition:background 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease; }
  button:hover{ box-shadow:var(--shadow-sm); }
  button:active{ transform:translateY(1px); }
  button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  #logoutBtn{ color:var(--text-danger); border-color:var(--border); background:var(--surface-2); flex-shrink:0; }
  #logoutBtn:hover{ background:var(--bg-danger); }
  .nav{
    display:flex; gap:6px; margin-bottom:1.5rem; flex-wrap:wrap; align-items:center;
    background:var(--surface-1); padding:6px; border-radius:999px;
  }
  .navbtn{ border-radius:999px; border:none; background:transparent; padding:8px 16px; font-weight:500; color:var(--text-secondary); }
  .navbtn:hover{ background:var(--surface-2); box-shadow:none; }
  .navbtn.active{ background:var(--surface-2); color:var(--text-primary); box-shadow:var(--shadow-sm); font-weight:600; }
  .daynav{ display:flex; align-items:center; gap:10px; margin-bottom:1.1rem; }
  .schedulewrap{ overflow-x:auto; margin-bottom:1.5rem; border-radius:var(--radius-lg); }
  .grid{ display:grid; gap:6px; min-width:560px; }
  .hdr{ font-size:12px; color:var(--text-muted); text-align:center; padding:4px 2px; }
  .courtname{ font-weight:700; color:var(--text-primary); font-size:13px; }
  .rowlabel{ font-size:11.5px; color:var(--text-muted); align-self:center; padding-right:6px; text-align:right; }
  .slot{ border-radius:8px; font-size:12px; text-align:center; padding:8px 4px; color:var(--text-secondary); background:var(--surface-1); min-height:38px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; box-shadow:var(--shadow-sm); transition:box-shadow 0.15s ease; }
  .slot.booked.game{ background:var(--bg-accent); color:var(--text-accent); }
  .slot.booked.training{ background:var(--bg-pro); color:var(--text-pro); }
  .slot.gap{ background:var(--bg-warning); color:var(--text-warning); cursor:pointer; border:1px dashed var(--border-warning); box-shadow:none; }
  .slot.gap:hover{ box-shadow:var(--shadow-md); }
  .slot-type{ font-weight:700; }
  .slot-players{ font-size:11px; opacity:0.85; line-height:1.3; word-break:break-word; }
  .slot-time{ font-size:10px; color:var(--text-muted); margin-top:2px; }
  .gapdetail{ margin-top:16px; display:none; background:var(--surface-1); border-radius:var(--radius-lg); padding:1.1rem; }
  .levelfilter{ display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; flex-wrap:wrap; }
  .levelfilter input{ width:56px; }
  .player{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); padding:9px 13px; font-size:13px; margin-bottom:8px; gap:8px; box-shadow:var(--shadow-sm); }
  .player .actions{ display:flex; align-items:center; gap:8px; }
  .notified{ color:var(--text-success); font-size:12px; }
  .card{ background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1.5rem; text-align:center; max-width:280px; margin:0 auto; box-shadow:var(--shadow-md); }
  .avatar{ width:64px; height:64px; border-radius:50%; background:var(--bg-accent); color:var(--text-accent); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:18px; margin:0 auto 12px; }
  .swipe-actions{ display:flex; justify-content:center; gap:16px; margin-top:16px; max-width:280px; margin-left:auto; margin-right:auto; }
  .round{ width:48px; height:48px; border-radius:50%; padding:0; font-size:20px; box-shadow:var(--shadow-sm); }
  .round:hover{ box-shadow:var(--shadow-md); }
  .msg{ text-align:center; font-size:13px; color:var(--text-success); margin-top:12px; display:none; max-width:280px; margin-left:auto; margin-right:auto; }
  .metrics{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .metric{ background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); padding:1rem 1.1rem; box-shadow:var(--shadow-sm); }
  .metric p:first-child{ font-size:12.5px; color:var(--text-secondary); margin:0 0 4px; }
  .metric p:last-child{ font-size:23px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .dateheader{ font-size:14px; font-weight:700; margin:22px 0 10px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.02em; }
  .dateheader:first-child{ margin-top:0; }
  .gapcard{ background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1rem 1.1rem; margin-bottom:12px; box-shadow:var(--shadow-sm); }
  .gapcard-title{ font-weight:700; font-size:13px; margin-bottom:2px; }
  .outcome{ display:flex; align-items:center; gap:6px; }
  .outcome-btn{ font-size:11px; padding:4px 9px; }
  .outcome-booked{ color:var(--text-success); font-size:12px; cursor:pointer; background:var(--bg-success); padding:3px 8px; border-radius:999px; }
  .outcome-no{ color:var(--text-danger); font-size:12px; cursor:pointer; background:var(--bg-danger); padding:3px 8px; border-radius:999px; }
  .datatable{ width:100%; border-collapse:collapse; font-size:12.5px; background:var(--surface-2); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); }
  .datatable th, .datatable td{ padding:9px 12px; text-align:left; border-bottom:0.5px solid var(--border); }
  .datatable th{ color:var(--text-secondary); font-weight:600; background:var(--surface-1); font-size:11.5px; text-transform:uppercase; letter-spacing:0.02em; }
  .datatable td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .datatable tr:last-child td{ border-bottom:none; }
  .datatable tr:hover td{ background:var(--surface-1); }
  .rank{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--bg-accent); color:var(--text-accent); font-size:11px; font-weight:700; margin-right:8px; }
  .vip-badge{ display:inline-block; margin-left:8px; padding:2px 8px; border-radius:999px; background:var(--bg-warning); color:var(--text-warning); font-size:10px; font-weight:700; letter-spacing:0.03em; vertical-align:middle; }
  @media (max-width:520px){
    body{ padding:0 0.75rem 2rem; }
    .topbar{ padding-top:1.1rem; }
    .nav{ overflow-x:auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🎾</div>
      <div>
        <h1>PadelFill</h1>
        <p class="sub">La Casa de Padel CY</p>
      </div>
    </div>
    <button id="logoutBtn">Αποσύνδεση</button>
  </header>

  <div class="nav">
    <button class="navbtn active" data-view="schedule">Πρόγραμμα & κενά</button>
    <button class="navbtn" data-view="weekly">Εβδομαδιαία κενά</button>
    <button class="navbtn" data-view="swipe">Swipe to play</button>
    <button class="navbtn" data-view="dash">Dashboard</button>
    <button class="navbtn" data-view="customers">Πελάτες</button>
  </div>

  <div id="view-schedule" class="view"></div>
  <div id="view-weekly" class="view" style="display:none;"></div>
  <div id="view-swipe" class="view" style="display:none;"></div>
  <div id="view-dash" class="view" style="display:none;"></div>
  <div id="view-customers" class="view" style="display:none;"></div>
</div>

<script src="app.js"></script>
</body>
</html>
